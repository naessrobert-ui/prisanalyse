name: Fix innbytte first registration

on:
  push:
    branches: ["chatgpt/fix-innbytte-first-reg"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-innbytte-first-reg
      - name: Apply targeted fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("bil_routes.py")
          s = p.read_text(encoding="utf-8")
          old = '''                    reg_norge = (flat.get("svv_registrert_forste_gang_norge") or "")

                    target_year = None
                    if reg_norge and len(reg_norge) >= 4 and reg_norge[:4].isdigit():
                        target_year = int(reg_norge[:4])
'''
          new = '''                    reg_norge = (flat.get("svv_registrert_forste_gang_norge") or "")
                    reg_forste = (flat.get("svv_registrert_forste_gang") or reg_norge)

                    target_year = None
                    if reg_forste and len(reg_forste) >= 4 and reg_forste[:4].isdigit():
                        target_year = int(reg_forste[:4])
'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
          elif new not in s:
              raise SystemExit("Fant ikke forventet target_year-blokk")

          t = Path("templates/bil_innbytte.html")
          html = t.read_text(encoding="utf-8")
          old_html = '''<div class="detail-item"><div class="detail-label">Førstegangsregistrert</div><div class="detail-value">{{ svv_preview.forstegang_norge or '–' }}</div></div>'''
          new_html = '''<div class="detail-item"><div class="detail-label">Førstegangsregistrert</div><div class="detail-value">{% if svv_preview.bruktimportert and svv_preview.forstegang_utland %}{{ svv_preview.forstegang_utland }}{% else %}{{ svv_preview.forstegang_norge or '–' }}{% endif %}</div></div>'''
          if old_html in html:
              html = html.replace(old_html, new_html, 1)
              t.write_text(html, encoding="utf-8")
          elif new_html not in html:
              raise SystemExit("Fant ikke forventet førstegangsregistrert-felt")
          PY

          if git diff --quiet; then
            echo "Ingen endringer nødvendig"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bil_routes.py templates/bil_innbytte.html
          git commit -m "Bruk faktisk førstegangsregistrering for bruktimport"
          git push origin HEAD:chatgpt/fix-innbytte-first-reg