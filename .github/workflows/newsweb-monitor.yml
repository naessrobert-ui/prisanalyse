name: NewsWeb AI monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsweb-monitor.yml'
      - 'newsweb_monitor/generation.py'
      - 'newsweb_monitor/monitor.py'
      - 'newsweb_monitor/dedup.py'
      - 'newsweb_monitor/publish_site.py'
  pull_request:
    paths:
      - 'newsweb_monitor/**'
      - 'newsweb_routes.py'
      - 'templates/newsweb_dashboard.html'
      - '.github/workflows/newsweb-monitor.yml'
  schedule:
    # GitHub cron is UTC only. These ranges cover 06–23 Oslo in both CET/CEST.
    # A local-time gate below discards out-of-window runs.
    - cron: '0,15,30,45 4-9 * * *'
    - cron: '0 10-22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'newsweb = automatisk Oslo Børs, demo = syntetiske meldinger, live = ekstern datakilde'
        type: choice
        options: [demo, newsweb, live]
        required: true
        default: newsweb
      dry_run:
        description: 'Ikke send Pushover'
        type: boolean
        default: true
      history_backfill:
        description: 'Hent inntil fire tidligere kvartalsrapporter for nylige regnskapsmeldinger'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: newsweb-hourly-monitor
  cancel-in-progress: false
jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
    steps:
      - name: Validate schedule in Oslo time
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Oslo date +%H)
          minute=$(TZ=Europe/Oslo date +%M)
          h=$((10#$hour))
          m=$((10#$minute))
          if (( h >= 6 && h < 10 )) || (( h >= 10 && h <= 23 && m < 15 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "NewsWeb scheduled within Oslo window: $hour:$minute"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outside Oslo window: $hour:$minute"
          fi
  monitor:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_MODE: ${{ github.event_name == 'pull_request' && 'demo' || github.event_name == 'workflow_dispatch' && inputs.mode || 'newsweb' }}
      DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.NEWSWEB_DRY_RUN || 'true' }}
      NEWS_FEED_URL: ${{ secrets.NEWS_FEED_URL }}
      REPO_PRIVATE: ${{ github.event.repository.private }}
      CONSENSUS_JSON_URL: ${{ secrets.CONSENSUS_JSON_URL }}
      LOOKBACK_HOURS: '36'
      INDEX_HOURS: '48'
      MAX_MESSAGES: '120'
      HISTORY_QUARTERS: ${{ github.event_name == 'workflow_dispatch' && inputs.history_backfill && '4' || '0' }}
      FEED_FORMAT: ${{ vars.FEED_FORMAT || 'json' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      VALID_MARKETS: ${{ vars.VALID_MARKETS || 'XOSL' }}
      EQUITY_TICKERS: ${{ vars.EQUITY_TICKERS }}
      NOTIFY_SCORE: ${{ vars.NOTIFY_SCORE || '75' }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PDF-leser
        run: python -m pip install "pypdf>=5,<8"
      - name: Kontroller Python-koden
        run: python -m py_compile newsweb_routes.py newsweb_consensus.py newsweb_monitor/report_analysis.py
      - name: Test nyhetsmotoren
        run: python -m unittest discover -s newsweb_monitor/tests -v
      - name: Test ekte NewsWeb-meldinger og PDF (kun PR)
        if: github.event_name == 'pull_request'
        run: python -m newsweb_monitor.smoke
      - uses: actions/cache/restore@v4
        with:
          path: newsweb_monitor/.cache/state.json
          key: newsweb-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            newsweb-state-
      - name: Analyser meldinger
        run: python -m newsweb_monitor.monitor
      - name: Skriv oppsummering
        if: always()
        run: |
          if [ -f newsweb_monitor/reports/latest.md ]; then
            cat newsweb_monitor/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ingen rapport generert. Se loggene.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: newsweb_monitor/.cache/state.json
          key: newsweb-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Bygg offentlig nyhetsoversikt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m newsweb_monitor.publish_site
      - name: Oppdater dashboard-data i GitHub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsweb_monitor/public/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: oppdater NewsWeb-nyheter [skip ci]"
            git push origin HEAD:main
          else
            echo "Ingen nye meldinger for dashboardet"
          fi
      - name: NewsWeb kildekontroll og ferskhetsvarsel
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m newsweb_monitor.healthcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsweb-rapport-${{ github.run_id }}
          path: newsweb_monitor/reports/
          retention-days: 30
          if-no-files-found: ignore
