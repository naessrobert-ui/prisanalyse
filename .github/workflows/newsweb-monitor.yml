name: NewsWeb AI monitor
on:
  pull_request:
    paths:
      - 'newsweb_monitor/**'
      - 'newsweb_routes.py'
      - 'templates/newsweb_dashboard.html'
      - '.github/workflows/newsweb-monitor.yml'
  schedule:
    - cron: '27 * * * *' # UTC. GitHub kan starte senere enn planlagt.
  workflow_dispatch:
    inputs:
      mode:
        description: 'newsweb = automatisk Oslo Børs, demo = syntetiske meldinger, live = ekstern datakilde'
        type: choice
        options: [demo, newsweb, live]
        required: true
        default: newsweb
      dry_run:
        description: 'Ikke send Pushover'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: newsweb-hourly-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_MODE: ${{ github.event_name == 'pull_request' && 'demo' || github.event_name == 'workflow_dispatch' && inputs.mode || 'newsweb' }}
      DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.NEWSWEB_DRY_RUN || 'true' }}
      NEWS_FEED_URL: ${{ secrets.NEWS_FEED_URL }}
      REPO_PRIVATE: ${{ github.event.repository.private }}
      CONSENSUS_JSON_URL: ${{ secrets.CONSENSUS_JSON_URL }}
      LOOKBACK_HOURS: '36'
      INDEX_HOURS: '48'
      MAX_MESSAGES: '120'
      FEED_FORMAT: ${{ vars.FEED_FORMAT || 'json' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      VALID_MARKETS: ${{ vars.VALID_MARKETS || 'XOSL' }}
      EQUITY_TICKERS: ${{ vars.EQUITY_TICKERS }}
      NOTIFY_SCORE: ${{ vars.NOTIFY_SCORE || '75' }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PDF-leser
        run: python -m pip install "pypdf>=5,<8"
      - name: Test nyhetsmotoren
        run: python -m unittest discover -s newsweb_monitor/tests -v
      - name: Test ekte NewsWeb-meldinger og PDF (kun PR)
        if: github.event_name == 'pull_request'
        run: python -m newsweb_monitor.smoke
      - uses: actions/cache/restore@v4
        with:
          path: newsweb_monitor/.cache/state.json
          key: newsweb-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            newsweb-state-
      - name: Analyser meldinger
        run: python -m newsweb_monitor.monitor
      - name: Skriv oppsummering
        if: always()
        run: |
          if [ -f newsweb_monitor/reports/latest.md ]; then
            cat newsweb_monitor/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ingen rapport generert. Se loggene.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: newsweb_monitor/.cache/state.json
          key: newsweb-state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsweb-rapport-${{ github.run_id }}
          path: newsweb_monitor/reports/
          retention-days: 30
          if-no-files-found: ignore
