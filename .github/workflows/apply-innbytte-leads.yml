name: Apply innbytte lead capture

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply innbytte changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Riktig førstegangsregistrering i beregning og visning.
          p = Path("bil_routes.py")
          s = p.read_text(encoding="utf-8")
          old = '''                    reg_norge = (flat.get("svv_registrert_forste_gang_norge") or "")

                    target_year = None
                    if reg_norge and len(reg_norge) >= 4 and reg_norge[:4].isdigit():
                        target_year = int(reg_norge[:4])
'''
          new = '''                    reg_norge = (flat.get("svv_registrert_forste_gang_norge") or "")
                    reg_forste = (flat.get("svv_registrert_forste_gang") or reg_norge)

                    target_year = None
                    if reg_forste and len(reg_forste) >= 4 and reg_forste[:4].isdigit():
                        target_year = int(reg_forste[:4])
'''
          if old not in s:
              raise SystemExit("Fant ikke registreringsblokken i bil_routes.py")
          s = s.replace(old, new, 1)
          old = '''                        "forstegang_norge": flat.get("svv_registrert_forste_gang_norge"),
                        "forstegang_utland": flat.get("svv_forstegang_reg_dato_utland"),
'''
          new = '''                        "forstegang": reg_forste or None,
                        "forstegang_norge": flat.get("svv_registrert_forste_gang_norge"),
                        "forstegang_utland": flat.get("svv_forstegang_reg_dato_utland"),
'''
          if old not in s:
              raise SystemExit("Fant ikke svv_preview-blokken i bil_routes.py")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # 2) Lead-endepunkt + enkel intern oversikt. Lagrer i samme S3 som appen allerede bruker.
          Path("innbytte_leads.py").write_text(r'''# -*- coding: utf-8 -*-
import html
import json
import re
import uuid
from datetime import datetime, timezone

import boto3
from flask import Blueprint, Response, jsonify, request

from config import AWS_KEY, AWS_SECRET, AWS_REGION, S3_BUCKET_NAME

innbytte_leads_bp = Blueprint("innbytte_leads", __name__)
LEAD_PREFIX = "calc/bil/innbytte_leads/"


def _s3():
    return boto3.client(
        "s3",
        region_name=AWS_REGION,
        aws_access_key_id=AWS_KEY,
        aws_secret_access_key=AWS_SECRET,
    )


def _clean(value, max_len=500):
    return (value or "").strip()[:max_len]


def _valid_email(value):
    return bool(re.match(r"^[^\s@]+@[^\s@]+\.[^\s@]+$", value or ""))


@innbytte_leads_bp.post("/innbytte/lead")
def submit_innbytte_lead():
    # Honeypot mot enkel bot-spam. Ekte brukere ser ikke feltet.
    if _clean(request.form.get("website"), 100):
        return jsonify({"ok": True})

    kind = _clean(request.form.get("kind"), 20)
    if kind not in {"tilbud", "prisfeedback"}:
        return jsonify({"ok": False, "error": "Ugyldig henvendelse."}), 400

    navn = _clean(request.form.get("navn"), 120)
    telefon = _clean(request.form.get("telefon"), 50)
    email = _clean(request.form.get("email"), 160)
    samtykke = _clean(request.form.get("samtykke"), 10)

    if not navn or not telefon or not email:
        return jsonify({"ok": False, "error": "Navn, telefon og e-post må fylles ut."}), 400
    if not _valid_email(email):
        return jsonify({"ok": False, "error": "Skriv inn en gyldig e-postadresse."}), 400
    if len(re.sub(r"\D", "", telefon)) < 5:
        return jsonify({"ok": False, "error": "Skriv inn et gyldig telefonnummer."}), 400
    if samtykke != "ja":
        return jsonify({"ok": False, "error": "Du må samtykke til at vi kan kontakte deg om henvendelsen."}), 400

    forventet_pris = _clean(request.form.get("forventet_pris"), 60)
    kommentar = _clean(request.form.get("kommentar"), 2000)
    if kind == "prisfeedback" and not forventet_pris:
        return jsonify({"ok": False, "error": "Oppgi hvilket prisnivå du mener er riktig."}), 400

    now = datetime.now(timezone.utc)
    payload = {
        "id": uuid.uuid4().hex,
        "type": kind,
        "opprettet_utc": now.isoformat(),
        "navn": navn,
        "telefon": telefon,
        "email": email,
        "samtykke": True,
        "regnr": _clean(request.form.get("regnr"), 20).upper(),
        "km": _clean(request.form.get("km"), 30),
        "bil": _clean(request.form.get("bil"), 200),
        "estimert_innbyttepris": _clean(request.form.get("estimat"), 60),
        "markedsniva": _clean(request.form.get("markedsniva"), 60),
        "forventet_pris": forventet_pris,
        "kommentar": kommentar,
        "side": _clean(request.form.get("side"), 200),
    }

    key = (
        f"{LEAD_PREFIX}{now:%Y/%m/%d}/"
        f"{now:%H%M%S}_{payload['id']}.json"
    )
    try:
        _s3().put_object(
            Bucket=S3_BUCKET_NAME,
            Key=key,
            Body=json.dumps(payload, ensure_ascii=False, indent=2).encode("utf-8"),
            ContentType="application/json; charset=utf-8",
        )
    except Exception as exc:
        print(f"[innbytte-lead] Kunne ikke lagre lead: {exc!r}")
        return jsonify({"ok": False, "error": "Kunne ikke sende henvendelsen akkurat nå. Prøv igjen litt senere."}), 500

    if kind == "tilbud":
        msg = "Takk! Vi har mottatt kontaktinformasjonen din og kan følge opp med et uforpliktende pristilbud."
    else:
        msg = "Takk! Tilbakemeldingen er mottatt. Den hjelper oss å forbedre prisestimatene."
    return jsonify({"ok": True, "message": msg})


@innbytte_leads_bp.get("/bil/innbytte/leads")
def innbytte_leads_admin():
    leads = []
    try:
        s3 = _s3()
        keys = []
        token = None
        while len(keys) < 250:
            kwargs = {"Bucket": S3_BUCKET_NAME, "Prefix": LEAD_PREFIX, "MaxKeys": 250}
            if token:
                kwargs["ContinuationToken"] = token
            resp = s3.list_objects_v2(**kwargs)
            keys.extend([x["Key"] for x in resp.get("Contents", [])])
            if not resp.get("IsTruncated"):
                break
            token = resp.get("NextContinuationToken")
        for key in sorted(keys, reverse=True)[:200]:
            try:
                obj = s3.get_object(Bucket=S3_BUCKET_NAME, Key=key)
                leads.append(json.loads(obj["Body"].read().decode("utf-8")))
            except Exception:
                continue
    except Exception as exc:
        return Response(f"Kunne ikke hente henvendelser: {html.escape(str(exc))}", status=500, mimetype="text/plain")

    def e(v):
        return html.escape(str(v or ""))

    rows = []
    for x in leads:
        typ = "Pristilbud" if x.get("type") == "tilbud" else "Prisfeedback"
        kommentar = x.get("kommentar") or ""
        if x.get("forventet_pris"):
            kommentar = f"Riktig pris: {x.get('forventet_pris')} — {kommentar}"
        rows.append(
            "<tr>"
            f"<td>{e(x.get('opprettet_utc'))}</td>"
            f"<td>{e(typ)}</td>"
            f"<td><strong>{e(x.get('bil'))}</strong><br>{e(x.get('regnr'))} · {e(x.get('km'))} km</td>"
            f"<td>{e(x.get('estimert_innbyttepris'))}<br><small>Marked: {e(x.get('markedsniva'))}</small></td>"
            f"<td>{e(x.get('navn'))}<br>{e(x.get('telefon'))}<br><a href='mailto:{e(x.get('email'))}'>{e(x.get('email'))}</a></td>"
            f"<td>{e(kommentar)}</td>"
            "</tr>"
        )

    page = f'''<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Innbyttehenvendelser</title>
<style>body{{font-family:system-ui;background:#071016;color:#eef4f7;margin:0;padding:28px}}a{{color:#a7ef5a}}h1{{margin-top:0}}table{{width:100%;border-collapse:collapse;background:#0d1a22}}th,td{{padding:11px;border:1px solid #263943;text-align:left;vertical-align:top;font-size:13px}}th{{color:#a7ef5a}}small{{color:#9db3bf}}</style></head><body>
<h1>Innbyttehenvendelser</h1><p>{len(leads)} siste henvendelser.</p><table><thead><tr><th>Tid</th><th>Type</th><th>Bil</th><th>Pris</th><th>Kontakt</th><th>Kommentar</th></tr></thead><tbody>{''.join(rows)}</tbody></table></body></html>'''
    return Response(page, mimetype="text/html")
''', encoding="utf-8")

          # 3) Registrer blueprint og gjør lead-endepunkt offentlig.
          p = Path("app.py")
          s = p.read_text(encoding="utf-8")
          old = "from ferie_routes import ferie_bp\n"
          new = "from ferie_routes import ferie_bp\nfrom innbytte_leads import innbytte_leads_bp\n"
          if old not in s:
              raise SystemExit("Fant ikke importpunkt i app.py")
          s = s.replace(old, new, 1)
          old = '''    "/innbytte",
    "/innbytte/",
    "/login",
'''
          new = '''    "/innbytte",
    "/innbytte/",
    "/innbytte/lead",
    "/login",
'''
          if old not in s:
              raise SystemExit("Fant ikke PUBLIC_PATHS i app.py")
          s = s.replace(old, new, 1)
          old = '''    app.register_blueprint(bil_bp)
    # Offentlig alias som gjenbruker nøyaktig samme beregningsmotor som /bil/innbytte.
'''
          new = '''    app.register_blueprint(bil_bp)
    app.register_blueprint(innbytte_leads_bp)
    # Offentlig alias som gjenbruker nøyaktig samme beregningsmotor som /bil/innbytte.
'''
          if old not in s:
              raise SystemExit("Fant ikke blueprint-punkt i app.py")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # 4) Oppdater feltet og legg to lead-bokser under resultatet.
          p = Path("templates/bil_innbytte.html")
          s = p.read_text(encoding="utf-8")
          old = '''<div class="detail-item"><div class="detail-label">Førstegangsregistrert</div><div class="detail-value">{{ svv_preview.forstegang_norge or '–' }}</div></div>'''
          new = '''<div class="detail-item"><div class="detail-label">Førstegangsregistrert</div><div class="detail-value">{{ svv_preview.forstegang or svv_preview.forstegang_norge or '–' }}</div></div>'''
          if old not in s:
              raise SystemExit("Fant ikke førstegangsregistrert-feltet i template")
          s = s.replace(old, new, 1)

          marker = '''      </div>
    </section>
    {% elif svv_preview and error and not model_selection %}'''
          if marker not in s:
              raise SystemExit("Fant ikke innsettingspunkt for lead-bokser")
          lead_html = r'''      </div>

      <style>
        .lead-capture-wrap{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.lead-card{border:1px solid #2b414d;border-radius:18px;padding:24px;background:#0c1921}.lead-card.offer{border-color:#628d3d;background:linear-gradient(145deg,rgba(167,239,90,.07),#0c1921 70%)}.lead-card h3{margin:5px 0 9px;font-size:22px}.lead-card p{margin:0;color:#9fb4c0;line-height:1.55;font-size:14px}.lead-card .lead-kicker{color:#a7ef5a;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.lead-card .lead-toggle{margin-top:18px;max-width:260px}.lead-form{display:none;margin-top:18px;border-top:1px solid #263943;padding-top:4px}.lead-form.open{display:block}.lead-form .lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.lead-form label{font-size:12px}.lead-form input,.lead-form textarea{width:100%;border:1px solid #425966;border-radius:9px;background:#09151c;color:#eef4f7;padding:12px;font:inherit;outline:0}.lead-form textarea{min-height:90px;resize:vertical}.lead-form input:focus,.lead-form textarea:focus{border-color:#a7ef5a;box-shadow:0 0 0 3px rgba(167,239,90,.1)}.lead-form .full{grid-column:1/-1}.lead-consent{display:flex;gap:9px;align-items:flex-start;margin-top:14px;color:#8fa7b3;font-size:11px;line-height:1.4}.lead-consent input{width:auto;margin-top:2px}.lead-status{margin-top:12px;font-size:13px;line-height:1.4}.lead-status.ok{color:#a7ef5a}.lead-status.err{color:#ffb3b3}.lead-hp{position:absolute;left:-9999px;opacity:0}.lead-price-hint{color:#7f98a6;font-size:11px;margin-top:5px}@media(max-width:760px){.lead-capture-wrap{grid-template-columns:1fr}.lead-form .lead-grid{grid-template-columns:1fr}.lead-form .full{grid-column:auto}}
      </style>
      <div class="lead-capture-wrap" id="kontakt">
        <div class="lead-card offer">
          <div class="lead-kicker">Kan dette være interessant?</div>
          <h3>Få et uforpliktende pristilbud</h3>
          <p>Ta kontakt, så kan vi se nærmere på bilen og sende deg et uforpliktende pristilbud.</p>
          <button type="button" class="lead-toggle" data-target="lead-tilbud"><span>Ja, kontakt meg</span><span>→</span></button>
          <form class="lead-form" id="lead-tilbud" action="/innbytte/lead" method="post">
            <input type="hidden" name="kind" value="tilbud"><input type="hidden" name="regnr" value="{{ svv_preview.regnr or regnr }}"><input type="hidden" name="km" value="{{ result.svv.km_input }}"><input type="hidden" name="bil" value="{{ (svv_preview.merke or '')|upper }} {{ svv_preview.modell or '' }}"><input type="hidden" name="estimat" value="{{ result.innbyttepris }}"><input type="hidden" name="markedsniva" value="{{ result.median_pris }}"><input type="hidden" name="side" value="/innbytte"><input class="lead-hp" type="text" name="website" tabindex="-1" autocomplete="off">
            <div class="lead-grid"><div><label>Navn</label><input name="navn" autocomplete="name" required></div><div><label>Telefon</label><input name="telefon" type="tel" autocomplete="tel" required></div><div class="full"><label>E-post</label><input name="email" type="email" autocomplete="email" required></div><div class="full"><label>Kommentar <span style="font-weight:400;color:#718996">(valgfritt)</span></label><textarea name="kommentar" placeholder="For eksempel når du ønsker å selge bilen."></textarea></div></div>
            <label class="lead-consent"><input type="checkbox" name="samtykke" value="ja" required><span>Jeg samtykker til at opplysningene brukes for å kontakte meg om denne henvendelsen.</span></label>
            <button type="submit"><span>Send kontaktinformasjon</span><span>→</span></button><div class="lead-status" aria-live="polite"></div>
          </form>
        </div>
        <div class="lead-card">
          <div class="lead-kicker">Ble prisen feil?</div>
          <h3>Fortell oss hvor vi bommet</h3>
          <p>Si hvilket prisnivå du mener er riktig for bilen. Tilbakemeldingen hjelper oss å forbedre modellen.</p>
          <button type="button" class="lead-toggle" data-target="lead-feedback"><span>Gi tilbakemelding</span><span>→</span></button>
          <form class="lead-form" id="lead-feedback" action="/innbytte/lead" method="post">
            <input type="hidden" name="kind" value="prisfeedback"><input type="hidden" name="regnr" value="{{ svv_preview.regnr or regnr }}"><input type="hidden" name="km" value="{{ result.svv.km_input }}"><input type="hidden" name="bil" value="{{ (svv_preview.merke or '')|upper }} {{ svv_preview.modell or '' }}"><input type="hidden" name="estimat" value="{{ result.innbyttepris }}"><input type="hidden" name="markedsniva" value="{{ result.median_pris }}"><input type="hidden" name="side" value="/innbytte"><input class="lead-hp" type="text" name="website" tabindex="-1" autocomplete="off">
            <div class="lead-grid"><div><label>Navn</label><input name="navn" autocomplete="name" required></div><div><label>Telefon</label><input name="telefon" type="tel" autocomplete="tel" required></div><div class="full"><label>E-post</label><input name="email" type="email" autocomplete="email" required></div><div class="full"><label>Hva mener du er riktig prisnivå?</label><input name="forventet_pris" inputmode="numeric" placeholder="f.eks. 245 000 kr" required><div class="lead-price-hint">Du kan oppgi omtrentlige tall.</div></div><div class="full"><label>Hva tror du vi har oversett?</label><textarea name="kommentar" placeholder="For eksempel utstyr, batteri, variant, importhistorikk eller lokale markedspriser."></textarea></div></div>
            <label class="lead-consent"><input type="checkbox" name="samtykke" value="ja" required><span>Jeg samtykker til at opplysningene brukes for å kontakte meg om denne henvendelsen.</span></label>
            <button type="submit"><span>Send tilbakemelding</span><span>→</span></button><div class="lead-status" aria-live="polite"></div>
          </form>
        </div>
      </div>
      <script>
        (function(){
          document.querySelectorAll('.lead-toggle').forEach(function(btn){btn.addEventListener('click',function(){var f=document.getElementById(btn.dataset.target);if(f){f.classList.toggle('open');if(f.classList.contains('open')){var x=f.querySelector('input[name="navn"]');if(x)x.focus();}}});});
          document.querySelectorAll('.lead-form').forEach(function(form){form.addEventListener('submit',async function(ev){ev.preventDefault();var status=form.querySelector('.lead-status');var submit=form.querySelector('button[type="submit"]');status.className='lead-status';status.textContent='Sender …';submit.disabled=true;try{var res=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'X-Requested-With':'fetch'}});var data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'Kunne ikke sende.');status.className='lead-status ok';status.textContent=data.message||'Takk! Henvendelsen er mottatt.';form.querySelectorAll('input:not([type="hidden"]):not([name="website"]), textarea').forEach(function(el){if(el.type==='checkbox')el.checked=false;else el.value='';});}catch(err){status.className='lead-status err';status.textContent=err.message||'Noe gikk galt. Prøv igjen.';}finally{submit.disabled=false;}});});
        })();
      </script>
    </section>
    {% elif svv_preview and error and not model_selection %}'''
          s = s.replace(marker, lead_html, 1)
          p.write_text(s, encoding="utf-8")
          PY

          git rm .github/workflows/apply-innbytte-leads.yml
          git config user.name "github-actions[bot]"
