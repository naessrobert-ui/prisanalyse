name: Oppdater Bilradar prislookup

on:
  schedule:
    # Daglig kl 03:30 UTC — etter at gårsdagens database_biler.parquet er
    # konsolidert (bil-daglig-aggregat kjører 04:00, men lookup leser bare
    # solgte rader og trenger ikke aggregatet). Justeres ved behov.
    - cron: "30 3 * * *"

  # Manuell trigger fra Actions-fanen — kjør på etterspørsel etter dataendring.
  workflow_dispatch:
    inputs:
      upload:
        description: "Last opp resultatet til S3"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  refresh-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bygg prislookup (S3 inn/ut)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'prisanalyse-data' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          UPLOAD_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          python -m scripts.lag_prislookup --s3 --output data/prislookup.csv $UPLOAD_FLAG

      - name: Last opp prislookup som artifact ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prislookup-failed-${{ github.run_id }}
          path: data/prislookup.csv
          if-no-files-found: ignore
          retention-days: 7
