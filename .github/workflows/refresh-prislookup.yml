name: Oppdater Bilradar prislookup

on:
  schedule:
    # Daglig kl 03:30 UTC — etter at gårsdagens database_biler.parquet er
    # konsolidert (bil-daglig-aggregat kjører 04:00, men lookup leser bare
    # solgte rader og trenger ikke aggregatet). Justeres ved behov.
    - cron: "30 3 * * *"

  # Manuell trigger fra Actions-fanen — kjør på etterspørsel etter dataendring.
  workflow_dispatch:
    inputs:
      upload:
        description: "Last opp resultatet til S3"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write  # committer fersk data/prislookup.csv tilbake (fallback holdes fersk)

jobs:
  refresh-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bygg prislookup (S3 inn/ut)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'prisanalyse-data' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          UPLOAD_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          python -m scripts.lag_prislookup --s3 --output data/prislookup.csv $UPLOAD_FLAG

      - name: Commit oppdatert prislookup (fersk lokal fallback)
        # Bygg-steget over skriver den ferske tabellen til data/prislookup.csv.
        # Vi committer den tilbake slik at den committede fallback-fila (brukt
        # når S3 er utilgjengelig, f.eks. Pi-cron uten AWS-creds) ikke blir
        # måneder gammel. For å begrense repo-churn (CSV ~0.7 MB) committes den
        # kun ukentlig (søndag) ved planlagt kjøring; manuell kjøring committer
        # alltid.
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' && inputs.upload == 'true'
           || github.event_name == 'schedule')
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "7" ]; then
            echo "Planlagt hverdag – S3 er oppdatert, hopper over commit av lokal fallback."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prislookup.csv
          if git diff --cached --quiet; then
            echo "Ingen endringer i prislookup."
          else
            git commit -m "Oppdater prislookup ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Last opp prislookup som artifact ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prislookup-failed-${{ github.run_id }}
          path: data/prislookup.csv
          if-no-files-found: ignore
          retention-days: 7
