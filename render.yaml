services:
  - type: cron
    name: global-oil-flow-refresh
    runtime: python
    schedule: "17 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.oil_flow_collector
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        value: prisanalyse-data
      - key: OIL_TRACKER_S3_PREFIX
        value: oil-tanker-data

  - type: cron
    name: weather-station-metrics-refresh
    runtime: python
    schedule: "0 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.refresh_station_metrics
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: FROST_CLIENT_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: WEATHER_STATION_METRICS_S3_KEY
        value: weather-station-metrics/cache.parquet
      - key: WEATHER_STATION_METRICS_LIMIT
        value: "0"
      - key: WEATHER_STATION_METRICS_TTL_SECONDS
        value: "10800"

  - type: cron
    name: media-arkiv-robert-naess
    runtime: python
    # Hver 6. time: henter alle kilder, merger nye treff inn i parquet-
    # arkivet paa S3 og beriker nye rader (sentiment/tema via Anthropic,
    # og:image + sitat fra artikkelsidene). Backfill manuelt med
    # `python -m scripts.oppdater_media_arkiv --days 365`.
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.oppdater_media_arkiv
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  - type: cron
    name: media-digest-robert-naess
    runtime: python
    # Mandager kl 06:00 UTC: ukentlig e-postdigest fra media-arkivet.
    # Sender bare naar SMTP_HOST og MEDIA_DIGEST_TO er satt.
    schedule: "0 6 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.media_digest
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MEDIA_DIGEST_TO
        sync: false
      - key: MEDIA_DIGEST_FROM
        sync: false

  - type: cron
    name: bil-daglig-aggregat
    runtime: python
    # Daglig kl 04:00 UTC (06:00 norsk sommertid). Velges etter at scraperen
    # er ferdig med gaarsdagens CSV. Backfill kan kjores manuelt med
    # `python -m scripts.bygg_daglig_aggregat --backfill`.
    schedule: "0 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.bygg_daglig_aggregat
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        sync: false

  - type: cron
    name: oppdater-fylke-snapshot
    runtime: python
    # Ukentlig (mandag 03:30 UTC): forhaandsberegner fylkestall for alle fylker
    # og lagrer dem i snapshot-tabellen, saa uttrekk paa nettsiden er
    # umiddelbare. Kan ogsaa trigges paa forespoersel via "Oppdater
    # underliggende tall"-knappen. Bruker appens IAM-tilkobling mot RDS.
    schedule: "30 3 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.oppdater_fylke_snapshot
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1

  - type: cron
    name: opprett-fylke-indekser
    runtime: python
    # Engangsjobb: oppretter DB-indeksene som gjoer fylkes-uttrekk raske
    # (scripts/sql/idx_entity_kommune_prefix.sql). Kjoeres manuelt via
    # "Trigger Run" i Render-dashbordet. Idempotent (IF NOT EXISTS), saa den
    # rare aarlige planen er bare for aa ha en gyldig schedule; kan slettes
    # naar indeksene er paa plass. Bruker appens IAM-tilkobling mot RDS.
    schedule: "0 4 1 1 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.opprett_fylke_indekser
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
