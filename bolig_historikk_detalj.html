<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <title>Bolig – Historikk detalj</title>
  <style>
    body { font-family: system-ui, Arial; margin: 16px; }
    .muted { color:#666; font-size: 12px; }
    img { max-width: 100%; height: auto; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <p><a href="{{ url_for('bolig.bolig_historikk_view', level=level, ny_brukt=ny_brukt, start=start, end=end) }}">← Tilbake</a></p>

  <h1>{{ value }}</h1>
  <div class="muted">{{ level }} · {{ ny_brukt }} · {{ start }} → {{ end }}</div>

  {% if plot_png %}
    <h3>Median m²-pris (daglig)</h3>
    <img src="data:image/png;base64,{{ plot_png }}" alt="Graf">
  {% else %}
    <p>Ingen data.</p>
  {% endif %}

</body>
</html>
