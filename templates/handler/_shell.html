{# templates/handler/_shell.html #}
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Handler{% endblock %} – prisanalyse.no</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --pa-dark: #0f1225; --pa-card: rgba(255,255,255,0.06);
      --pa-border: rgba(255,255,255,0.08); --pa-accent: #e74c8a;
      --pa-text: #e2e8f0; --pa-muted: #94a3b8;
    }
    body { background: var(--pa-dark); color: var(--pa-text); font-family: system-ui, -apple-system, sans-serif; }
    .navbar { background: rgba(15,18,37,0.95); border-bottom: 1px solid var(--pa-border); }
    .navbar-brand { color: #fff !important; font-weight: 700; }
    .page-header {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1225 100%);
      border-radius: 14px; padding: 28px 32px; margin-bottom: 24px;
      border: 1px solid var(--pa-border);
    }
    .page-header h1 { font-size: 1.6rem; margin: 0 0 4px 0; }
    .page-header .sub { color: var(--pa-muted); font-size: 0.9rem; }
    .panel {
      background: var(--pa-card); border: 1px solid var(--pa-border);
      border-radius: 14px; padding: 20px; margin-bottom: 20px;
    }
    label { color: var(--pa-muted); font-size: 0.85rem; margin-bottom: 4px; display: block; }
    .form-control, .form-select {
      background: rgba(255,255,255,0.05); border: 1px solid var(--pa-border);
      color: var(--pa-text); border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255,255,255,0.08); border-color: var(--pa-accent);
      color: var(--pa-text); box-shadow: 0 0 0 2px rgba(231,76,138,0.2);
    }
    .btn-primary {
      background: var(--pa-accent); border: none; border-radius: 999px;
      padding: 8px 24px; font-weight: 600;
    }
    .btn-primary:hover { background: #d63d7a; }
    .btn-outline-secondary {
      color: var(--pa-muted); border-color: var(--pa-border); border-radius: 999px;
    }
    .btn-outline-secondary:hover { background: rgba(255,255,255,0.05); color: #fff; }

    /* Tables */
    .table-container { overflow-x: auto; }
    table.data-table {
      width: 100%; border-collapse: collapse; font-size: 0.88rem;
    }
    table.data-table th {
      background: rgba(255,255,255,0.04); color: var(--pa-muted);
      padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--pa-border);
      font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none;
    }
    table.data-table th:hover { color: var(--pa-accent); }
    table.data-table th.active-sort { color: var(--pa-accent); }
    table.data-table td {
      padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    table.data-table tr:hover td { background: rgba(255,255,255,0.03); }
    table.data-table tr.row-clickable { cursor: pointer; }
    .text-pos { color: #34d399; }
    .text-neg { color: #f87171; }
    .empty-msg { color: var(--pa-muted); text-align: center; padding: 32px; font-style: italic; }
    .spinner { display: inline-block; width: 18px; height: 18px;
      border: 2px solid var(--pa-muted); border-top-color: var(--pa-accent);
      border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-results {
      position: absolute; z-index: 100; background: #1a1f3a;
      border: 1px solid var(--pa-border); border-radius: 8px;
      max-height: 250px; overflow-y: auto; width: 100%;
    }
    .search-results .item {
      padding: 8px 12px; cursor: pointer; font-size: 0.88rem;
    }
    .search-results .item:hover { background: rgba(231,76,138,0.15); }
    .search-wrap { position: relative; }
    .table-controls {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .table-slider-wrap {
      display: flex; align-items: center; gap: 10px; color: var(--pa-muted); font-size: 0.82rem;
    }
    .table-slider-wrap input[type="range"] { width: 180px; }
    .table-page-info { color: var(--pa-muted); font-size: 0.82rem; }
    a { color: var(--pa-accent); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark px-4">
    <a class="navbar-brand" href="/">📈 FinansApp</a>
    <div>
      <a href="{{ url_for('handler.handler_index') }}" class="text-white text-decoration-none me-3">Handler oversikt</a>
      <a href="/" class="text-white text-decoration-none">← Hjem</a>
    </div>
  </nav>

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ── Shared JS helpers ──

    /** Debounce function */
    function debounce(fn, ms) {
      let t; return function(...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
    }

    /** Format number with 1-2 decimals and space as thousands sep */
    function fmtNum(v, dec=1) {
      if (v == null || isNaN(v)) return '–';
      return Number(v).toLocaleString('nb-NO', {minimumFractionDigits: dec, maximumFractionDigits: dec});
    }

    /** Format integer */
    function fmtInt(v) {
      if (v == null || isNaN(v)) return '–';
      return Number(v).toLocaleString('nb-NO', {maximumFractionDigits: 0});
    }

    /** Color class for positive/negative */
    function signClass(v) { return v > 0 ? 'text-pos' : v < 0 ? 'text-neg' : ''; }

    function compareValues(a, b) {
      if (a == null && b == null) return 0;
      if (a == null) return -1;
      if (b == null) return 1;

      const na = Number(a);
      const nb = Number(b);
      if (!Number.isNaN(na) && !Number.isNaN(nb)) {
        return na - nb;
      }
      return String(a).localeCompare(String(b), 'nb', {sensitivity: 'base'});
    }

    /** Build a sortable + paged <table> from rows + column config */
    function buildTable(rows, columns, containerId, options={}) {
      const c = document.getElementById(containerId);
      if (!rows || rows.length === 0) {
        c.innerHTML = '<div class="empty-msg">Ingen data</div>';
        return;
      }

      const key = options.tableKey || containerId;
      const pageSizes = options.pageSizes || [10, 20, 30, 50, 100];
      const defaultPageSize = pageSizes.includes(options.defaultPageSize) ? options.defaultPageSize : pageSizes[0];
      const tableState = {
        allRows: Array.from(rows),
        sortCol: options.initialSort?.key || null,
        sortAsc: options.initialSort?.asc ?? false,
        pageSize: defaultPageSize,
      };

      const sliderId = `${key}-rows-slider`;
      const valueId = `${key}-rows-value`;
      const infoId = `${key}-page-info`;

      c.innerHTML = `
        <div class="table-controls">
          <div class="table-slider-wrap">
            <span>Vis rader</span>
            <input type="range" id="${sliderId}" min="0" max="${pageSizes.length - 1}" value="${pageSizes.indexOf(defaultPageSize)}" step="1">
            <strong id="${valueId}">${defaultPageSize}</strong>
          </div>
          <div class="table-page-info" id="${infoId}"></div>
        </div>
        <div class="table-container"></div>
      `;

      const slider = document.getElementById(sliderId);
      const pageInfo = document.getElementById(infoId);
      const pageValue = document.getElementById(valueId);
      const tableWrap = c.querySelector('.table-container');

      function renderTable() {
        const sorted = Array.from(tableState.allRows);
        if (tableState.sortCol) {
          sorted.sort((ra, rb) => {
            const cmp = compareValues(ra[tableState.sortCol], rb[tableState.sortCol]);
            return tableState.sortAsc ? cmp : -cmp;
          });
        }

        const visibleRows = sorted.slice(0, tableState.pageSize);
        pageValue.textContent = tableState.pageSize;
        pageInfo.textContent = `Viser ${visibleRows.length} av ${sorted.length} rader`;

        let html = '<table class="data-table"><thead><tr>';
        columns.forEach(col => {
          const active = tableState.sortCol === col.key;
          const arrow = active ? (tableState.sortAsc ? ' ▲' : ' ▼') : '';
          html += `<th class="${active ? 'active-sort' : ''}" data-col="${col.key}">${col.label}${arrow}</th>`;
        });
        html += '</tr></thead><tbody>';

        visibleRows.forEach((row, idx) => {
          const clickableClass = typeof options.onRowClick === 'function' ? 'row-clickable' : '';
          html += `<tr class="${clickableClass}" data-row-idx="${idx}">`;
          columns.forEach(col => {
            let val = row[col.key];
            let cls = '';
            if (col.fmt === 'num') { cls = signClass(val); val = fmtNum(val, col.dec || 1); }
            else if (col.fmt === 'int') { val = fmtInt(val); }
            else { val = val ?? '–'; }
            html += `<td class="${cls}">${val}</td>`;
          });
          html += '</tr>';
        });

        html += '</tbody></table>';
        tableWrap.innerHTML = html;

        tableWrap.querySelectorAll('th[data-col]').forEach(th => {
          th.addEventListener('click', () => {
            const key = th.dataset.col;
            if (tableState.sortCol === key) {
              tableState.sortAsc = !tableState.sortAsc;
            } else {
              tableState.sortCol = key;
              tableState.sortAsc = true;
            }
            renderTable();
          });
        });

        if (typeof options.onRowClick === 'function') {
          tableWrap.querySelectorAll('tbody tr').forEach((tr) => {
            tr.addEventListener('click', () => {
              const rowIdx = Number(tr.dataset.rowIdx);
              options.onRowClick(visibleRows[rowIdx]);
            });
          });
        }
      }

      slider.addEventListener('input', () => {
        tableState.pageSize = pageSizes[Number(slider.value)] || defaultPageSize;
        renderTable();
      });

      renderTable();
    }

    /** Live-search dropdown for investors or securities */
    function setupSearch(inputId, resultsId, apiUrl, labelKey, idKey, onSelect) {
      const input = document.getElementById(inputId);
      const results = document.getElementById(resultsId);
      let currentData = [];

      input.addEventListener('input', debounce(async function() {
        const q = this.value.trim();
        if (q.length < 3) { results.style.display = 'none'; return; }
        try {
          const resp = await fetch(`${apiUrl}?q=${encodeURIComponent(q)}`);
          currentData = await resp.json();
          if (currentData.error) { results.style.display = 'none'; return; }
          results.innerHTML = currentData.map((item, i) =>
            `<div class="item" data-idx="${i}">${item[labelKey]}</div>`
          ).join('');
          results.style.display = currentData.length ? 'block' : 'none';
        } catch(e) { results.style.display = 'none'; }
      }, 300));

      results.addEventListener('click', function(e) {
        const item = e.target.closest('.item');
        if (!item) return;
        const idx = parseInt(item.dataset.idx);
        const selected = currentData[idx];
        input.value = selected[labelKey];
        results.style.display = 'none';
        onSelect(selected);
      });

      document.addEventListener('click', function(e) {
        if (!results.contains(e.target) && e.target !== input) {
          results.style.display = 'none';
        }
      });
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
