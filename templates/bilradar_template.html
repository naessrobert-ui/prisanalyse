<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilRadar – Finn gode bilkjøp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a24;
  --border: #2a2a3a; --text: #e8e8f0; --text2: #8888a0;
  --accent: #00d4aa; --danger: #ff6b6b; --warning: #ffd93d;
  --good: #00d4aa; --great: #00ff88;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { padding: 24px 32px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #0f0f18, var(--bg)); }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.header h1 span { color: var(--accent); }
.header .subtitle { color: var(--text2); font-size: 14px; margin-top: 4px; }
.stats-bar { display: flex; gap: 24px; padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 13px; flex-wrap: wrap; }
.stat { display:flex; gap:6px; align-items:center; }
.stat-label { color: var(--text2); }
.stat-value { font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.stat-value.green { color: var(--accent); }
.layout { display: flex; min-height: calc(100vh - 130px); }
.sidebar { width: 320px; min-width: 320px; border-right: 1px solid var(--border); padding: 20px; background: var(--surface); overflow-y: auto; max-height: calc(100vh - 130px); }
.filter-group { margin-bottom: 18px; }
.filter-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 6px; font-weight: 600; }
.filter-group input, .filter-group select { width: 100%; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
.filter-group input:focus, .filter-group select:focus { border-color: var(--accent); }
.filter-group select option { background: var(--surface2); }
.range-row { display: flex; gap: 8px; }
.range-row input { width: 50%; }
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; user-select: none; }
.chip:hover { border-color: var(--accent); }
.chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; cursor: pointer; }
.toggle { width: 40px; height: 22px; background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; position: relative; transition: all 0.2s; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--text2); border-radius: 50%; transition: all 0.2s; }
.toggle.active { background: var(--accent); border-color: var(--accent); }
.toggle.active::after { left: 20px; background: #000; }
.toggle-label { font-size: 13px; color: var(--text); }
.sort-bar { padding: 12px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: wrap; }
.sort-bar span { color: var(--text2); }
.sort-btn { padding: 5px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.15s; }
.sort-btn:hover { border-color: var(--accent); }
.sort-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.results { flex: 1; overflow-y: auto; padding: 16px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.2s; cursor: pointer; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,170,0.08); }
.card-img { width: 100%; height: 180px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 13px; position: relative; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.deal-badge { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.deal-badge.great { background: rgba(0,255,136,0.15); color: var(--great); border: 1px solid rgba(0,255,136,0.3); }
.deal-badge.good { background: rgba(0,212,170,0.15); color: var(--good); border: 1px solid rgba(0,212,170,0.3); }
.deal-badge.ok { background: rgba(255,217,61,0.15); color: var(--warning); border: 1px solid rgba(255,217,61,0.3); }
.deal-badge.bad { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.2); }
.deal-badge.none { background: rgba(136,136,160,0.12); color: var(--text2); border: 1px solid rgba(136,136,160,0.2); }
.card-body { padding: 16px; }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 12px; color: var(--text2); margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-specs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.spec { font-size: 12px; color: var(--text2); }
.card-price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-price { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.card-est { font-size: 12px; color: var(--text2); }
.card-est span { font-family: 'JetBrains Mono', monospace; }
.card-location { font-size: 11px; color: var(--text2); margin-top: 8px; }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text2); }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.reset-btn { margin-top: 16px; padding: 10px 20px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; }
.page-nav { padding: 16px 24px; text-align: center; border-top: 1px solid var(--border); }
.page-btn { padding: 8px 20px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; font-size: 13px; font-family: inherit; margin: 0 4px; }
.page-btn:hover { border-color: var(--accent); }
.page-info { color: var(--text2); font-size: 13px; margin: 0 12px; }
@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; min-width: unset; max-height: unset; border-right: none; border-bottom: 1px solid var(--border); }
  .results { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="header">
  <h1>Bil<span>Radar</span></h1>
  <div class="subtitle">__ANTALL__ biler til salgs · Prisanalyse basert på ML-modell (hurtigsalg) · Generert __DATO__</div>
</div>
<div id="stats-bar" class="stats-bar"></div>
<div class="layout">
  <div class="sidebar">
    <div class="filter-group">
      <label>S&#xF8;k</label>
      <input type="text" id="search" placeholder="F.eks. Tesla Model 3, BMW X3..." oninput="debounceFilter()">
    </div>
    <div class="filter-group">
      <label>Merke</label>
      <select id="merke" onchange="applyFilters()"><option value="">Alle merker</option></select>
    </div>
    <div class="filter-group">
      <label>Fylke</label>
      <select id="fylke" onchange="applyFilters()"><option value="">Alle fylker</option></select>
    </div>
    <div class="filter-group">
      <label>Drivstoff</label>
      <select id="drivstoff" onchange="applyFilters()"><option value="">Alle drivstoff</option></select>
    </div>
    <div class="filter-group">
      <label>Karosseri</label>
      <select id="karosseri" onchange="applyFilters()"><option value="">Alle typer</option></select>
    </div>
    <div class="filter-group">
      <label>Girkasse</label>
      <div class="chip-group" id="gir-chips"></div>
    </div>
    <div class="filter-group">
      <label>Hjuldrift</label>
      <div class="chip-group" id="hjul-chips"></div>
    </div>
    <div class="filter-group">
      <label>Pris (kr)</label>
      <div class="range-row">
        <input type="number" id="pris-min" placeholder="Fra" oninput="debounceFilter()">
        <input type="number" id="pris-max" placeholder="Til" oninput="debounceFilter()">
      </div>
    </div>
    <div class="filter-group">
      <label>&#xC5;rsmodell</label>
      <div class="range-row">
        <input type="number" id="aar-min" placeholder="Fra" oninput="debounceFilter()">
        <input type="number" id="aar-max" placeholder="Til" oninput="debounceFilter()">
      </div>
    </div>
    <div class="filter-group">
      <label>Kj&#xF8;relengde (km)</label>
      <div class="range-row">
        <input type="number" id="km-min" placeholder="Fra" oninput="debounceFilter()">
        <input type="number" id="km-max" placeholder="Til" oninput="debounceFilter()">
      </div>
    </div>
    <div class="filter-group">
      <label>Prismodell</label>
      <div class="toggle-row" onclick="toggleDeals()">
        <div class="toggle" id="deals-toggle"></div>
        <span class="toggle-label">Vis kun gode kj&#xF8;p</span>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="sort-bar">
      <span>Sorter:</span>
      <button class="sort-btn active" data-sort="rabatt" onclick="setSort(this)">Beste kj&#xF8;p</button>
      <button class="sort-btn" data-sort="pris-lav" onclick="setSort(this)">Pris &#x2191;</button>
      <button class="sort-btn" data-sort="pris-hoy" onclick="setSort(this)">Pris &#x2193;</button>
      <button class="sort-btn" data-sort="aar" onclick="setSort(this)">Nyeste</button>
      <button class="sort-btn" data-sort="km" onclick="setSort(this)">Lavest km</button>
    </div>
    <div class="results" id="results"></div>
    <div class="page-nav" id="page-nav"></div>
  </div>
</div>
<script>
var DATA = __DATA_JSON__;
var THRESHOLD = __THRESHOLD__;
var PAGE_SIZE = 60;

var state = {
  search: '', merke: '', fylke: '', drivstoff: '', karosseri: '',
  gir: [], hjul: [],
  prisMin: null, prisMax: null, aarMin: null, aarMax: null,
  kmMin: null, kmMax: null, onlyDeals: false, sort: 'rabatt', page: 0
};
var filteredCache = [];
var debounceTimer = null;

function debounceFilter() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilters, 200);
}

function init() {
  populateDropdown('merke', 'm');
  populateDropdown('fylke', 'fy');
  populateDropdown('drivstoff', 'd');
  populateDropdown('karosseri', 'ka');

  makeChips('gir-chips', ['Automat','Manuell'], 'gir');
  makeChips('hjul-chips', ['Firehjul','Tohjul'], 'hjul');

  applyFilters();
}

function populateDropdown(elId, field) {
  var vals = [], seen = {};
  for (var j = 0; j < DATA.length; j++) {
    var v = DATA[j][field];
    if (v && !seen[v]) { seen[v] = true; vals.push(v); }
  }
  vals.sort();
  var sel = document.getElementById(elId);
  for (var j = 0; j < vals.length; j++) {
    var opt = document.createElement('option');
    opt.value = vals[j]; opt.textContent = vals[j];
    sel.appendChild(opt);
  }
}

function makeChips(containerId, values, stateKey) {
  var gc = document.getElementById(containerId);
  for (var j = 0; j < values.length; j++) {
    (function(v) {
      var chip = document.createElement('div');
      chip.className = 'chip'; chip.textContent = v;
      chip.onclick = function() {
        var idx = state[stateKey].indexOf(v);
        if (idx >= 0) { state[stateKey].splice(idx, 1); this.classList.remove('active'); }
        else { state[stateKey].push(v); this.classList.add('active'); }
        applyFilters();
      };
      gc.appendChild(chip);
    })(values[j]);
  }
}

function toggleDeals() {
  state.onlyDeals = !state.onlyDeals;
  var tog = document.getElementById('deals-toggle');
  if (state.onlyDeals) tog.classList.add('active');
  else tog.classList.remove('active');
  applyFilters();
}

function setSort(btn) {
  var btns = document.querySelectorAll('.sort-btn');
  for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
  btn.classList.add('active');
  state.sort = btn.getAttribute('data-sort');
  state.page = 0;
  sortAndRender();
}

function applyFilters() {
  state.search = document.getElementById('search').value.toLowerCase();
  state.merke = document.getElementById('merke').value;
  state.fylke = document.getElementById('fylke').value;
  state.drivstoff = document.getElementById('drivstoff').value;
  state.karosseri = document.getElementById('karosseri').value;
  state.prisMin = parseFloat(document.getElementById('pris-min').value) || null;
  state.prisMax = parseFloat(document.getElementById('pris-max').value) || null;
  state.aarMin = parseFloat(document.getElementById('aar-min').value) || null;
  state.aarMax = parseFloat(document.getElementById('aar-max').value) || null;
  state.kmMin = parseFloat(document.getElementById('km-min').value) || null;
  state.kmMax = parseFloat(document.getElementById('km-max').value) || null;
  state.page = 0;

  filteredCache = [];
  for (var j = 0; j < DATA.length; j++) {
    var c = DATA[j];
    if (state.search) {
      var hay = ((c.b||'') + ' ' + (c.nf||'') + ' ' + (c.st||'') + ' ' + (c.fy||'')).toLowerCase();
      if (hay.indexOf(state.search) < 0) continue;
    }
    if (state.merke && c.m !== state.merke) continue;
    if (state.fylke && c.fy !== state.fylke) continue;
    if (state.drivstoff && c.d !== state.drivstoff) continue;
    if (state.karosseri && c.ka !== state.karosseri) continue;
    if (state.gir.length > 0 && state.gir.indexOf(c.g) < 0) continue;
    if (state.hjul.length > 0 && state.hjul.indexOf(c.hj) < 0) continue;
    if (state.prisMin && c.p < state.prisMin) continue;
    if (state.prisMax && c.p > state.prisMax) continue;
    if (state.aarMin && c.a < state.aarMin) continue;
    if (state.aarMax && c.a > state.aarMax) continue;
    if (state.kmMin && c.k < state.kmMin) continue;
    if (state.kmMax && c.k > state.kmMax) continue;
    if (state.onlyDeals && c.r <= THRESHOLD) continue;
    filteredCache.push(c);
  }

  sortAndRender();
}

function sortAndRender() {
  var s = state.sort;
  if (s === 'rabatt') filteredCache.sort(function(a,b) { return (b.r||0) - (a.r||0); });
  else if (s === 'pris-lav') filteredCache.sort(function(a,b) { return a.p - b.p; });
  else if (s === 'pris-hoy') filteredCache.sort(function(a,b) { return b.p - a.p; });
  else if (s === 'aar') filteredCache.sort(function(a,b) { return (b.a||0) - (a.a||0); });
  else if (s === 'km') filteredCache.sort(function(a,b) { return (a.k||999999) - (b.k||999999); });

  updateStats(filteredCache);
  var start = state.page * PAGE_SIZE;
  renderCards(filteredCache.slice(start, start + PAGE_SIZE));
  renderPageNav();
}

function updateStats(filtered) {
  var deals = 0, sum = 0;
  for (var j = 0; j < filtered.length; j++) {
    if (filtered[j].r > THRESHOLD) { deals++; sum += filtered[j].r; }
  }
  var avgR = deals > 0 ? (sum / deals).toFixed(1) : '0';
  document.getElementById('stats-bar').innerHTML =
    '<div class="stat"><span class="stat-label">Viser</span><span class="stat-value">' + filtered.length + '</span><span class="stat-label">av ' + DATA.length + ' biler</span></div>' +
    '<div class="stat"><span class="stat-label">Gode kj\u00F8p (&gt;' + THRESHOLD + '%)</span><span class="stat-value green">' + deals + '</span></div>' +
    '<div class="stat"><span class="stat-label">Snitt rabatt</span><span class="stat-value green">' + avgR + '%</span></div>';
}

function fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

function renderCards(cars) {
  var container = document.getElementById('results');
  if (cars.length === 0) {
    container.innerHTML = '<div class="empty-state"><h3>Ingen biler funnet</h3><p>Pr\u00F8v \u00E5 justere filtrene</p><button class="reset-btn" onclick="resetFilters()">Nullstill filtre</button></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < cars.length; i++) {
    var c = cars[i];
    var dc = c.r > 30 ? 'great' : c.r > 10 ? 'good' : c.r > 0 ? 'ok' : c.r === 0 ? 'none' : 'bad';
    var dt;
    if (!c.ml || c.ml === 'none') dt = 'Ingen modell';
    else if (c.r > 0) dt = c.r + '% under';
    else if (c.r < 0) dt = Math.abs(c.r) + '% over';
    else dt = 'Riktig priset';

    var hasImg = c.im && c.im.length > 10;
    var imgH = hasImg ? '<img src="' + c.im + '" loading="lazy" onerror="this.parentElement.innerHTML=\'Ingen bilde\'">' : 'Ingen bilde';
    var estH = c.ep ? '<div class="card-est">Estimert: <span>' + fmt(c.ep) + ' kr</span></div>' : '';
    var specs = [c.a||'?', c.k?fmt(c.k)+' km':'?', c.d||'', c.g||'', c.hj||'', c.ka||''];
    var specsH = '';
    for (var s = 0; s < specs.length; s++) {
      if (specs[s]) specsH += '<div class="spec">' + specs[s] + '</div>';
    }

    html += '<div class="card" onclick="window.open(\'https://www.finn.no/car/used/ad.html?finnkode=' + c.i + '\',\'_blank\')">' +
      '<div class="card-img">' + imgH + '<div class="deal-badge ' + dc + '">' + dt + '</div></div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + (c.b || ((c.m||'') + ' ' + (c.mo||''))) + '</div>' +
        '<div class="card-sub">' + (c.nf || '') + '</div>' +
        '<div class="card-specs">' + specsH + '</div>' +
        '<div class="card-price-row"><div class="card-price">' + fmt(c.p) + ' kr</div>' + estH + '</div>' +
        '<div class="card-location">\uD83D\uDCCD ' + (c.st || '') + (c.fy ? ' \u00B7 ' + c.fy : '') + (c.fh ? ' \u00B7 ' + c.fh : '') + '</div>' +
      '</div></div>';
  }
  container.innerHTML = html;
  container.scrollTop = 0;
}

function renderPageNav() {
  var total = filteredCache.length;
  var totalPages = Math.ceil(total / PAGE_SIZE);
  if (totalPages <= 1) { document.getElementById('page-nav').innerHTML = ''; return; }
  var cur = state.page + 1;
  document.getElementById('page-nav').innerHTML =
    (state.page > 0 ? '<button class="page-btn" onclick="goPage(' + (state.page-1) + ')">\u2190 Forrige</button>' : '') +
    '<span class="page-info">Side ' + cur + ' av ' + totalPages + ' (' + total + ' biler)</span>' +
    (state.page < totalPages-1 ? '<button class="page-btn" onclick="goPage(' + (state.page+1) + ')">Neste \u2192</button>' : '');
}

function goPage(p) {
  state.page = p;
  var start = p * PAGE_SIZE;
  renderCards(filteredCache.slice(start, start + PAGE_SIZE));
  renderPageNav();
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('merke').value = '';
  document.getElementById('fylke').value = '';
  document.getElementById('drivstoff').value = '';
  document.getElementById('karosseri').value = '';
  document.getElementById('pris-min').value = '';
  document.getElementById('pris-max').value = '';
  document.getElementById('aar-min').value = '';
  document.getElementById('aar-max').value = '';
  document.getElementById('km-min').value = '';
  document.getElementById('km-max').value = '';
  state.gir = []; state.hjul = [];
  state.onlyDeals = false;
  var chips = document.querySelectorAll('.chip');
  for (var j = 0; j < chips.length; j++) chips[j].classList.remove('active');
  document.getElementById('deals-toggle').classList.remove('active');
  applyFilters();
}

init();
</script>
</body>
</html>
