<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <title>{{ tittel }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Montserrat", system-ui, sans-serif;
            min-height: 100vh;
            padding: 32px 16px 40px;
            color: #e5e7eb;
            background:
                linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.9)),
                url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1920')
                no-repeat center center fixed;
            background-size: cover;
        }

        .page { max-width: 1200px; margin: 0 auto; }
        a { color: #60a5fa; text-decoration: none; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 0.8rem;
            letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85;
        }

        h1 { font-size: 2.6rem; margin-bottom: 8px; }
        h1 .highlight { color: #60a5fa; }

        .subtitle { font-size: 0.95rem; color: #d1d5db; margin-bottom: 24px; }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 18px 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 16px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #9ca3af;
        }

        input, select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
            font-size: 0.82rem;
        }

        .btn-primary {
            margin-top: 12px;
            padding: 8px 20px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .kpi-row { display: flex; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
        .kpi {
            flex: 1 1 150px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.35);
        }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        th, td {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(31, 41, 55, 0.95);
            white-space: nowrap;
        }
        th { cursor: pointer; color: #9ca3af; }
        th.sort-asc::after { content: " ▲"; }
        th.sort-desc::after { content: " ▼"; }

        tbody tr:hover { background: rgba(30, 64, 175, 0.35); }

        td.info {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
<div class="page">

<div class="top-bar">
    <div>PRISANALYSE.NO</div>
    <a href="/bil">← Til bilanalyse</a>
</div>

<h1><span class="highlight">Dette</span> ble bilene solgt for</h1>
<div class="subtitle">Se prisendringer, dager i markedet og annonse-historikk.</div>

<div class="card">
    <button class="btn-primary" id="updateBtn">Oppdater søk</button>

    <div class="kpi-row">
        <div class="kpi"><div>Snitt dager</div><div id="kpiAvgDager">–</div></div>
        <div class="kpi"><div>Median dager</div><div id="kpiMedianDager">–</div></div>
        <div class="kpi"><div>Median pris</div><div id="kpiMedianPris">–</div></div>
        <div class="kpi"><div>Laveste pris</div><div id="kpiLavestePris">–</div></div>
        <div class="kpi"><div>Antall</div><div id="kpiAntallBiler">–</div></div>
    </div>

    <div class="charts-grid">
        <canvas id="medianPriceChart"></canvas>
        <canvas id="soldPerDayChart"></canvas>
    </div>
</div>

<h2 style="margin-top:20px;">Utforsk resultater</h2>

<table id="resultTable">
<thead>
<tr>
    <th data-key="produsent">Produsent</th>
    <th data-key="modell">Modell</th>
    <th data-key="overskrift">Info</th>
    <th data-key="årstall">År</th>
    <th data-key="kjørelengde">Km</th>
    <th data-key="pris_start">Pris start</th>
    <th data-key="pris_ny">Pris ny</th>
    <th data-key="pris_endring">Endring</th>
    <th data-key="dager">Dager</th>
    <th data-key="dato_start">Startdato</th>
    <th data-key="dato_end">Siste dato</th>
    <th data-key="selger">Selger</th>
    <th data-key="finnkode">FINN</th>
</tr>
</thead>
<tbody id="resultBody"></tbody>
</table>

</div>

<script>
let currentRows = [];
let currentSortKey = "pris_ny";
let currentSortDir = "asc";

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function formatNumber(n) {
  return n == null || isNaN(n) ? "–" : n.toLocaleString("nb-NO");
}

function formatDate(d) {
  if (!d) return "–";
  const dt = new Date(d);
  return isNaN(dt) ? d : dt.toISOString().slice(0,10);
}

function renderTable() {
  currentRows.sort((a,b)=>{
    const va=a[currentSortKey], vb=b[currentSortKey];
    if(va==null) return 1; if(vb==null) return -1;
    return currentSortDir==="asc" ? va-vb : vb-va;
  });

  const tbody=document.getElementById("resultBody");
  tbody.innerHTML="";
  currentRows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.produsent||""}</td>
      <td>${r.modell||""}</td>
      <td class="info" title="${escapeHtml(r.overskrift)}">${escapeHtml(r.overskrift)}</td>
      <td>${r.årstall||""}</td>
      <td>${formatNumber(r.kjørelengde)}</td>
      <td>${formatNumber(r.pris_start)}</td>
      <td>${formatNumber(r.pris_ny ?? r.pris_last)}</td>
      <td>${formatNumber(r.pris_endring)}</td>
      <td>${r.dager||""}</td>
      <td>${formatDate(r.dato_start)}</td>
      <td>${formatDate(r.dato_end)}</td>
      <td>${r.selger||""}</td>
      <td>${r.finnkode ? `<a href="https://www.finn.no/mobility/item/${r.finnkode}" target="_blank">${r.finnkode}</a>` : ""}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById("updateBtn").addEventListener("click", async ()=>{
  const res = await fetch("{{ data_url }}", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ filters:{} })
  });
  const data = await res.json();
  currentRows = data.historikk || [];
  renderTable();
});
</script>

</body>
</html>
