<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <title>Nedbør i Norge – Væranalyse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
      }

      .page {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 16px 32px;
      }

      .card {
        background: white;
        border-radius: 16px;
        padding: 18px 22px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        margin-bottom: 16px;
      }

      .card h1 {
        margin: 0 0 8px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        align-items: center;
      }

      .controls input,
      .controls select {
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
      }

      .controls button {
        padding: 7px 14px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      #map-frame {
        width: 100%;
        height: 80vh;
        border: none;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
        background: #e5e7eb;
      }
    </style>
  </head>

  <body>
    <div class="page">

      <div class="card">
        <h1>Nedbør i Norge</h1>
        <p>
          Standard er rullerende siste 24 timer (caches i 5 minutter).
          Du kan også velge kalenderdøgn, måned-til-dato eller år-til-dato.
        </p>

        <form id="controls" class="controls">
          <label for="date-input">Dato:</label>
          <input
            type="date"
            id="date-input"
            name="date"
            value="{{ default_date }}"
            max="{{ default_date }}"
          />

          <label for="mode">Periode:</label>
          <select id="mode" name="mode">
            <option value="last24h" selected>Siste 24 timer (rullerende)</option>
            <option value="day">Kalenderdøgn (valgt dato)</option>
            <option value="mtd">Hittil i måneden</option>
            <option value="ytd">Hittil i året</option>
          </select>

          <button type="submit">Vis</button>
        </form>
      </div>

      <iframe
        id="map-frame"
        src="{{ url_for('ver.nedbor_kart') }}?mode=last24h"
        loading="lazy"
      ></iframe>

    </div>

    <script>
      const form = document.getElementById("controls");
      const dateInput = document.getElementById("date-input");
      const modeSelect = document.getElementById("mode");
      const frame = document.getElementById("map-frame");

      function updateFrame() {
        const mode = modeSelect.value || "last24h";
        const baseUrl = "{{ url_for('ver.nedbor_kart') }}";

        const qs = new URLSearchParams();
        qs.set("mode", mode);

        // date brukes ikke for last24h
        if (mode !== "last24h") {
          const d = dateInput.value;
          if (d) qs.set("date", d);
        }

        frame.src = `${baseUrl}?${qs.toString()}`;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        updateFrame();
      });

      modeSelect.addEventListener("change", updateFrame);
    </script>
  </body>
</html>
