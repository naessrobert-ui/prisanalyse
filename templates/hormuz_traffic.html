<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hormuz-trafikk</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Arial, sans-serif; margin: 0; background: #0b1220; color: #e2e8f0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 8px; }
    .muted { color: #94a3b8; margin-bottom: 18px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
    button.secondary { background: #334155; }
    textarea { width: 100%; min-height: 160px; background: #020617; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { border-bottom: 1px solid #1f2937; padding: 8px; text-align: left; }
    th { color: #93c5fd; }
    .status { font-size: 0.92rem; color: #cbd5e1; }
    .status.ok { color: #34d399; }
    .status.warn { color: #f59e0b; }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Skipstrafikk i Hormuz-stredet</h1>
    <p class="muted">Laster ekte data fra SQLite. Demo brukes kun når du trykker "Last demo-data".</p>

    <div class="card">
      <div class="toolbar">
        <button id="loadLive">Last ekte data (SQLite)</button>
        <button id="loadDemo" class="secondary">Last demo-data</button>
        <button id="bootstrapData" class="secondary">Hent ferske AIS nå</button>
        <button id="applyJson" class="secondary">Bruk JSON fra feltet</button>
        <a href="/hormuz/map" style="display:inline-block;padding:10px 14px;background:#0ea5e9;border-radius:8px;color:#fff;text-decoration:none;">Åpne Folium-kart</a>
      </div>
      <div id="statusLine" class="status">Klar.</div>
      <textarea id="jsonInput" placeholder='{"rows":[{"date":"2026-04-01","northbound":50,"southbound":45,"tankers":35,"lng":10}]}'></textarea>
    </div>

    <div class="card">
      <canvas id="trafficChart" height="120"></canvas>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Dato</th>
            <th>Nordgående</th>
            <th>Sørgående</th>
            <th>Totalt</th>
            <th>Tankskip</th>
            <th>LNG</th>
          </tr>
        </thead>
        <tbody id="trafficTableBody"></tbody>
      </table>
    </div>
  </div>

<script>
  let chart;

  function setStatus(text, cls = '') {
    const el = document.getElementById('statusLine');
    el.textContent = text;
    el.className = `status ${cls}`.trim();
  }

  function normalizeRows(rows) {
    return (rows || []).map(row => {
      const north = Number(row.northbound || 0);
      const south = Number(row.southbound || 0);
      return {
        date: row.date || '-',
        northbound: north,
        southbound: south,
        total: Number(row.total || (north + south)),
        tankers: Number(row.tankers || 0),
        lng: Number(row.lng || 0),
      };
    });
  }

  function renderTable(rows) {
    const tbody = document.getElementById('trafficTableBody');
    tbody.innerHTML = '';
    rows.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${row.northbound}</td>
        <td>${row.southbound}</td>
        <td>${row.total}</td>
        <td>${row.tankers}</td>
        <td>${row.lng}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderChart(rows) {
    const ctx = document.getElementById('trafficChart');
    const labels = rows.map(r => r.date);
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Nordgående', data: rows.map(r => r.northbound), borderColor: '#60a5fa', tension: 0.2 },
          { label: 'Sørgående', data: rows.map(r => r.southbound), borderColor: '#34d399', tension: 0.2 },
          { label: 'Totalt', data: rows.map(r => r.total), borderColor: '#f59e0b', tension: 0.2 }
        ]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });
  }

  function applyPayload(payload) {
    const rows = normalizeRows(payload.rows || payload);
    renderTable(rows);
    renderChart(rows);
  }

  async function loadLive(hours = 24) {
    setStatus('Laster ekte data fra SQLite ...');
    const res = await fetch(`/hormuz/api/traffic?hours=${hours}`);
    const payload = await res.json();

    document.getElementById('jsonInput').value = JSON.stringify(payload, null, 2);

    if (!res.ok) {
      setStatus(`Feil ved lasting av ekte data: ${payload.error || res.statusText}`, 'error');
      throw new Error(payload.error || res.statusText);
    }

    applyPayload(payload);
    const rawCount = payload.meta?.raw_messages_in_window ?? 0;
    const updated = payload.meta?.last_received_at_utc || '-';
    if (!payload.rows || payload.rows.length === 0) {
      setStatus(`Ingen rader i valgt vindu (${hours}t). Råmeldinger i vindu: ${rawCount}. Siste melding: ${updated}`, 'warn');
    } else {
      setStatus(`Ekte data lastet: ${payload.rows.length} dager, ${rawCount} råmeldinger siste ${hours}t. Siste melding: ${updated}`, 'ok');
    }
  }


  async function bootstrapData() {
    setStatus('Starter innhenting av ferske AIS-data ... dette kan ta opptil 1-2 min.', 'warn');
    const res = await fetch('/hormuz/api/bootstrap', { method: 'POST' });
    const payload = await res.json();
    document.getElementById('jsonInput').value = JSON.stringify(payload, null, 2);
    if (!res.ok || !payload.ok) {
      setStatus(`Bootstrap feilet: ${payload.error || res.statusText}`, 'error');
      throw new Error(payload.error || res.statusText);
    }
    setStatus('AIS-data hentet. Laster ekte data ...', 'ok');
    await loadLive(24);
  }

  async function loadDemo() {
    const res = await fetch('/hormuz/api/demo');
    const payload = await res.json();
    document.getElementById('jsonInput').value = JSON.stringify(payload, null, 2);
    applyPayload(payload);
    setStatus('Viser demo-data (ikke ekte trafikk).', 'warn');
  }

  document.getElementById('loadLive').addEventListener('click', () => loadLive(24));
  document.getElementById('loadDemo').addEventListener('click', loadDemo);
  document.getElementById('bootstrapData').addEventListener('click', () => bootstrapData().catch(() => {}));
  document.getElementById('applyJson').addEventListener('click', () => {
    try {
      const payload = JSON.parse(document.getElementById('jsonInput').value);
      applyPayload(payload);
      setStatus('JSON-data lagt inn manuelt.', 'ok');
    } catch (err) {
      setStatus(`Ugyldig JSON: ${err.message}`, 'error');
    }
  });

  loadLive().catch(() => {
    setStatus('Kunne ikke laste ekte data. Bruk "Last demo-data" for testvisning.', 'error');
  });
</script>
</body>
</html>
