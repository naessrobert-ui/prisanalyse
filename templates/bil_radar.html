<!DOCTYPE html>

<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilRadar - Finn gode bilkjop</title>
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --border: #2a2e3a;
      --text: #e4e4e7; --text-muted: #9ca3af; --accent: #3b82f6;
      --green: #22c55e; --red: #ef4444; --radius: 10px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; }
    .header { background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%); border-bottom:1px solid var(--border); padding:1.25rem 1.5rem; position:sticky; top:0; z-index:100; }
    .header-inner { max-width:1400px; margin:0 auto; }
    .header h1 { font-size:1.5rem; font-weight:700; color:#fff; }
    .header h1 span { color:var(--accent); }
    .header-meta { font-size:0.8rem; color:var(--text-muted); margin-top:0.2rem; }
    .stats-bar { max-width:1400px; margin:1rem auto; padding:0 1rem; display:flex; gap:0.75rem; flex-wrap:wrap; }
    .stat-badge { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:0.5rem 1rem; font-size:0.85rem; }
    .stat-badge strong { color:var(--accent); }
    .filters { max-width:1400px; margin:0.75rem auto; padding:0 1rem; display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
    .filters input,.filters select { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:0.5rem 0.75rem; font-size:0.85rem; outline:none; }
    .filters input:focus,.filters select:focus { border-color:var(--accent); }
    .filters input::placeholder { color:var(--text-muted); }
    .search-input { flex:1; min-width:180px; }
    .filters select { min-width:120px; }
    .filter-label { font-size:0.75rem; color:var(--text-muted); margin-right:-0.25rem; }
    .sort-bar { max-width:1400px; margin:0.5rem auto; padding:0 1rem; display:flex; gap:0.4rem; flex-wrap:wrap; }
    .sort-btn { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); color:var(--text-muted); padding:0.35rem 0.75rem; font-size:0.78rem; cursor:pointer; }
    .sort-btn:hover { border-color:var(--accent); color:var(--text); }
    .sort-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .grid { max-width:1400px; margin:1rem auto; padding:0 1rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:0.75rem; }
    .car-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:transform 0.15s,border-color 0.15s; cursor:pointer; display:flex; flex-direction:column; text-decoration:none; color:inherit; }
    .car-card:hover { transform:translateY(-2px); border-color:var(--accent); }
    .car-card.good-deal { border-color:var(--green); box-shadow:0 0 12px rgba(34,197,94,0.15); }
    .card-img-wrap { position:relative; width:100%; aspect-ratio:16/10; background:#111318; overflow:hidden; }
    .card-img-wrap img { width:100%; height:100%; object-fit:cover; }
    .card-img-wrap .no-img { display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:var(--text-muted); font-size:0.8rem; }
    .badge-discount { position:absolute; top:0.5rem; right:0.5rem; background:var(--green); color:#fff; font-weight:700; font-size:0.8rem; padding:0.2rem 0.5rem; border-radius:6px; }
    .badge-discount.neutral { background:#6b7280; }
    .badge-discount.bad { background:var(--red); }
    .card-body { padding:0.75rem; flex:1; display:flex; flex-direction:column; gap:0.3rem; }
    .card-title { font-size:0.95rem; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-subtitle { font-size:0.78rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-specs { display:flex; gap:0.5rem; flex-wrap:wrap; font-size:0.75rem; color:var(--text-muted); margin-top:0.2rem; }
    .card-specs span { white-space:nowrap; }
    .card-price-row { display:flex; justify-content:space-between; align-items:baseline; margin-top:auto; padding-top:0.4rem; border-top:1px solid var(--border); }
    .card-price { font-size:1.15rem; font-weight:700; color:#fff; }
    .card-price-orig { font-size:0.75rem; color:var(--text-muted); text-decoration:line-through; margin-left:0.4rem; font-weight:400; }
    .card-expected { font-size:0.78rem; color:var(--text-muted); }
    .card-expected .val { color:var(--green); font-weight:600; }
    .card-location { font-size:0.72rem; color:var(--text-muted); margin-top:0.15rem; }
    .card-days { color:var(--accent); }
    .results-info { max-width:1400px; margin:0 auto; padding:0 1rem; font-size:0.8rem; color:var(--text-muted); }
    @media(max-width:640px){ .grid{grid-template-columns:1fr} .header h1{font-size:1.25rem} }
    .loading-msg { text-align:center; padding:3rem; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <h1>Bil<span>Radar</span></h1>
      <div class="header-meta">__ANTALL__ biler analysert &middot; __DATO__</div>
    </div>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="filters">
    <input type="text" class="search-input" id="searchInput" placeholder="Sok merke, modell, info...">
    <span class="filter-label">Drivstoff:</span>
    <select id="fuelFilter"><option value="">Alle</option></select>
    <span class="filter-label">Fylke:</span>
    <select id="fylkeFilter"><option value="">Alle</option></select>
    <span class="filter-label">Min rabatt:</span>
    <select id="discountFilter">
      <option value="0">Alle</option>
      <option value="5">&ge; 5 %</option>
      <option value="10" selected>&ge; 10 %</option>
      <option value="15">&ge; 15 %</option>
      <option value="20">&ge; 20 %</option>
      <option value="30">&ge; 30 %</option>
    </select>
    <span class="filter-label">Maks pris:</span>
    <input type="number" id="maxPriceInput" placeholder="Maks pris" style="width:110px;">
    <span class="filter-label">Min ar:</span>
    <input type="number" id="minYearInput" placeholder="F.eks. 2018" style="width:100px;">
  </div>
  <div class="sort-bar">
    <button class="sort-btn active" data-sort="discount">Storst rabatt</button>
    <button class="sort-btn" data-sort="price-asc">Lavest pris</button>
    <button class="sort-btn" data-sort="price-desc">Hoyest pris</button>
    <button class="sort-btn" data-sort="year-desc">Nyest</button>
    <button class="sort-btn" data-sort="km-asc">Lavest km</button>
  </div>
  <div class="results-info" id="resultsInfo"></div>
  <div class="grid" id="carGrid"><div class="loading-msg">Laster biler...</div></div>
<script>
(function(){
  "use strict";
  var THRESHOLD=__THRESHOLD__;
  var ALL_CARS=__DATA_JSON__;
  function fk(c){return c.i||0}
  function mk(c){return c.m||""}
  function mo(c){return c.mo||""}
  function nf(c){return c.nf||""}
  function yr(c){return c.a||0}
  function km(c){return c.k||0}
  function gi(c){return c.g||""}
  function dr(c){return c.d||""}
  function hj(c){return c.hj||""}
  function pr(c){return c.p||0}
  function pf(c){return c.pf||0}
  function se(c){return c.s||""}
  function st(c){return c.st||""}
  function fy(c){return c.fy||""}
  function im(c){return c.im||""}
  function ep(c){return c.ep||0}
  function rb(c){return c.r||0}
  function dm(c){return c.dm||0}
  function finnUrl(c){var id=fk(c);return id?"https://www.finn.no/mobility/item/"+id:"#"}
  function fmtKr(n){if(!n)return"–";return n.toLocaleString("nb-NO")+" kr"}
  function fmtKm(n){if(!n)return"–";return n.toLocaleString("nb-NO")+" km"}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  var fuels={};
  ALL_CARS.forEach(function(c){var f=dr(c);if(f)fuels[f]=(fuels[f]||0)+1});
  var fuelSel=document.getElementById("fuelFilter");
  Object.keys(fuels).sort().forEach(function(f){var o=document.createElement("option");o.value=f;o.textContent=f+" ("+fuels[f]+")";fuelSel.appendChild(o)});
  var fylker={};
  ALL_CARS.forEach(function(c){var f=fy(c);if(f)fylker[f]=(fylker[f]||0)+1});
  var fylkeSel=document.getElementById("fylkeFilter");
  Object.keys(fylker).sort().forEach(function(f){var o=document.createElement("option");o.value=f;o.textContent=f+" ("+fylker[f]+")";fylkeSel.appendChild(o)});
  function updateStats(cars){
    var bar=document.getElementById("statsBar");
    var good=cars.filter(function(c){return rb(c)>=THRESHOLD}).length;
    var wd=cars.filter(function(c){return rb(c)>0});
    var avg=0;if(wd.length)avg=wd.reduce(function(s,c){return s+rb(c)},0)/wd.length;
    bar.innerHTML='<div class="stat-badge"><strong>'+cars.length+'</strong> biler vist</div><div class="stat-badge"><strong>'+good+'</strong> gode kjop (≥'+THRESHOLD+'% rabatt)</div><div class="stat-badge">Snitt rabatt: <strong>'+avg.toFixed(1)+' %</strong></div>';
  }
  var currentSort="discount";
  function sortCars(cars,method){
    var s=cars.slice();
    switch(method){
      case"discount":s.sort(function(a,b){return rb(b)-rb(a)});break;
      case"price-asc":s.sort(function(a,b){return pr(a)-pr(b)});break;
      case"price-desc":s.sort(function(a,b){return pr(b)-pr(a)});break;
      case"year-desc":s.sort(function(a,b){return yr(b)-yr(a)||rb(b)-rb(a)});break;
      case"km-asc":s.sort(function(a,b){return(km(a)||999999)-(km(b)||999999)});break;
    }
    return s;
  }
  function getFiltered(){
    var q=(document.getElementById("searchInput").value||"").toLowerCase();
    var fuel=document.getElementById("fuelFilter").value;
    var fylke=document.getElementById("fylkeFilter").value;
    var minDisc=parseFloat(document.getElementById("discountFilter").value)||0;
    var maxPrice=parseInt(document.getElementById("maxPriceInput").value)||0;
    var minYear=parseInt(document.getElementById("minYearInput").value)||0;
    return ALL_CARS.filter(function(c){
      if(minDisc>0&&rb(c)<minDisc)return false;
      if(fuel&&dr(c)!==fuel)return false;
      if(fylke&&fy(c)!==fylke)return false;
      if(maxPrice>0&&pr(c)>maxPrice)return false;
      if(minYear>0&&yr(c)<minYear)return false;
      if(q){var h=(mk(c)+" "+mo(c)+" "+nf(c)+" "+se(c)+" "+st(c)+" "+fy(c)).toLowerCase();if(h.indexOf(q)===-1)return false}
      return true;
    });
  }
  var MAX_RENDER=200;
  function renderCards(cars){
    var grid=document.getElementById("carGrid");
    var info=document.getElementById("resultsInfo");
    var display=cars.slice(0,MAX_RENDER);
    info.textContent=cars.length+" treff"+(cars.length>MAX_RENDER?" (viser "+MAX_RENDER+" forste)":"");
    if(!cars.length){grid.innerHTML='<div class="loading-msg">Ingen biler matcher filtrene.</div>';return}
    var html="";
    for(var i=0;i<display.length;i++){
      var c=display[i];var discount=rb(c);var isGood=discount>=THRESHOLD;
      var bc=discount>=THRESHOLD?"":(discount>0?" neutral":" bad");
      var bt=discount>0?("-"+discount.toFixed(1)+" %"):(discount<0?("+"+Math.abs(discount).toFixed(1)+" %"):"0 %");
      var imgH=im(c)?'<img src="'+esc(im(c))+'" alt="" loading="lazy">':'<div class="no-img">Ingen bilde</div>';
      var title=esc(mk(c)+(mo(c)?" "+mo(c):""));
      var sub=esc(nf(c));
      var specs=[];
      if(yr(c))specs.push(yr(c));if(km(c))specs.push(fmtKm(km(c)));if(dr(c))specs.push(esc(dr(c)));if(hj(c))specs.push(esc(hj(c)));if(gi(c))specs.push(esc(gi(c)));
      var locParts=[st(c),fy(c)].filter(Boolean);
      var loc=locParts.join(", ");
      var days=dm(c);
      var locHtml=loc?esc(loc):"";
      if(days>0){locHtml+=(locHtml?' &middot; ':'')+'<span class="card-days">'+days+' dager til salgs</span>'}
      var origP=pf(c);var curP=pr(c);
      var priceHtml='<div class="card-price">'+fmtKr(curP)+(origP&&origP>curP?'<span class="card-price-orig">'+fmtKr(origP)+'</span>':'')+'</div>';
      html+='<a class="car-card'+(isGood?' good-deal':'')+'" href="'+finnUrl(c)+'" target="_blank" rel="noopener"><div class="card-img-wrap">'+imgH+'<div class="badge-discount'+bc+'">'+bt+'</div></div><div class="card-body"><div class="card-title">'+title+'</div>'+(sub?'<div class="card-subtitle">'+sub+'</div>':'')+'<div class="card-specs">'+specs.map(function(s){return'<span>'+s+'</span>'}).join("")+'</div><div class="card-price-row">'+priceHtml+(ep(c)?'<div class="card-expected">Forventet: <span class="val">'+fmtKr(ep(c))+'</span></div>':'')+'</div>'+(locHtml?'<div class="card-location">'+locHtml+'</div>':'')+'</div></a>';
    }
    grid.innerHTML=html;
  }
  function refresh(){var f=getFiltered();var s=sortCars(f,currentSort);updateStats(f);renderCards(s)}
  function debounce(fn,ms){var t;return function(){clearTimeout(t);t=setTimeout(fn,ms)}}
  document.getElementById("searchInput").addEventListener("input",debounce(refresh,250));
  document.getElementById("fuelFilter").addEventListener("change",refresh);
  document.getElementById("fylkeFilter").addEventListener("change",refresh);
  document.getElementById("discountFilter").addEventListener("change",refresh);
  document.getElementById("maxPriceInput").addEventListener("input",debounce(refresh,400));
  document.getElementById("minYearInput").addEventListener("input",debounce(refresh,400));
  document.querySelectorAll(".sort-btn").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".sort-btn").forEach(function(b){b.classList.remove("active")});
      btn.classList.add("active");currentSort=btn.getAttribute("data-sort");refresh();
    });
  });
  refresh();
})();
</script>
</body>
</html>
