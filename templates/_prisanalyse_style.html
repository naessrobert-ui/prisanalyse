{# Delt stil for /bil/prisanalyse-sidene. Matcher bil_landing.html sin
   mørke glassmorf-look og overstyrer base.html sin lyse card-content.
   Inkluderes via `{% include "_prisanalyse_style.html" %}` på toppen av
   content-blokken i hver av prisanalyse-templatene. #}
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- Body-typografi paa prisanalyse-sider ---- */
  body {
    font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    color: #f1f5f9;
  }

  /* Overstyrer base.html sin lyse card-content med en moerk glassmorf-versjon */
  .card-content {
    background: rgba(10, 16, 26, 0.72) !important;
    color: #f1f5f9 !important;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 18px;
    box-shadow: 0 22px 56px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px;
  }
  .card-content h3,
  .card-content h4,
  .card-content h5,
  .card-content h6 {
    color: #f8fafc !important;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card-content p { color: rgba(241, 245, 249, 0.85); }
  .card-content .text-muted,
  .card-content small.text-muted { color: rgba(203, 213, 225, 0.75) !important; }
  .card-content a { color: #60a5fa; text-decoration: none; }
  .card-content a:hover { color: #93c5fd; text-decoration: underline; }

  /* "Hero"-baand paa toppen av hver side */
  .pa-hero {
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(15, 32, 39, 0.85) 0%, rgba(44, 83, 100, 0.62) 100%);
    border: 1px solid rgba(255, 255, 255, 0.10);
    padding: 24px 28px;
    margin-bottom: 18px;
    box-shadow: 0 22px 56px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
  }
  .pa-hero .brand {
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: 11px;
    opacity: .75;
    color: #93c5fd;
    font-weight: 600;
  }
  .pa-hero h1, .pa-hero h2, .pa-hero h3 {
    margin: 6px 0 6px;
    font-weight: 800;
    color: #f8fafc !important;
  }
  .pa-hero h1 .accent, .pa-hero h2 .accent, .pa-hero h3 .accent { color: #60a5fa; }
  .pa-hero .sub { color: rgba(241, 245, 249, 0.82); font-size: 14px; }

  /* Mette metrikker-kort (Siste medianpris osv) */
  .pa-metric {
    text-align: center;
    padding: 16px 12px !important;
  }
  .pa-metric .label {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: rgba(203, 213, 225, 0.75);
    margin-bottom: 4px;
  }
  .pa-metric .value {
    font-size: 26px;
    font-weight: 800;
    color: #f8fafc;
    line-height: 1.1;
  }
  .pa-metric .sub {
    font-size: 12px;
    color: rgba(203, 213, 225, 0.7);
    margin-top: 4px;
  }
  .pa-metric.up .value { color: #4ade80; }
  .pa-metric.down .value { color: #f87171; }

  /* Skjema-elementer */
  .card-content label,
  .card-content .form-group label {
    color: rgba(203, 213, 225, 0.85);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-content .form-control,
  .card-content select.form-control,
  .card-content input.form-control {
    background: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    color: #f8fafc !important;
    border-radius: 10px !important;
    font-family: inherit;
  }
  .card-content .form-control:focus {
    background: rgba(255, 255, 255, 0.10) !important;
    border-color: #60a5fa !important;
    box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25) !important;
    color: #fff !important;
  }
  .card-content .form-control option {
    background: #0f172a;
    color: #f1f5f9;
  }
  .card-content .form-text { color: rgba(148, 163, 184, 0.8) !important; }

  /* Knapper */
  .card-content .btn-primary,
  .card-content .btn.btn-primary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 700;
    letter-spacing: .02em;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .card-content .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(37, 99, 235, 0.45);
  }
  .card-content .btn-outline-primary {
    border-radius: 999px;
    border: 1px solid rgba(96, 165, 250, 0.4) !important;
    color: #93c5fd !important;
    background: rgba(96, 165, 250, 0.06);
  }
  .card-content .btn-outline-primary:hover {
    background: rgba(96, 165, 250, 0.18);
    color: #fff !important;
  }
  .card-content .btn-outline-secondary {
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    color: rgba(241, 245, 249, 0.85) !important;
    background: rgba(255, 255, 255, 0.04);
  }
  .card-content .btn-outline-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff !important;
  }
  .card-content .btn-outline-secondary.active {
    background: rgba(96, 165, 250, 0.22);
    border-color: rgba(96, 165, 250, 0.5) !important;
    color: #fff !important;
  }
  .card-content .btn-link {
    color: rgba(148, 163, 184, 0.85) !important;
  }
  .card-content .btn-link:hover { color: #fff !important; }

  /* Tabeller - overstyr base.html sin lyse stil */
  .card-content .table,
  .card-content .table tbody tr td,
  .card-content .table thead th {
    background: transparent !important;
    color: #e2e8f0 !important;
    border-color: rgba(255, 255, 255, 0.06) !important;
  }
  .card-content .table thead th {
    background: rgba(255, 255, 255, 0.03) !important;
    color: #cbd5e1 !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .card-content .table tbody tr:nth-child(odd),
  .card-content .table tbody tr:nth-child(even) {
    background: transparent !important;
  }
  .card-content .table tbody tr:hover td {
    background: rgba(96, 165, 250, 0.08) !important;
  }
  .card-content .table a { color: #cbd5e1; }
  .card-content .table a:hover { color: #60a5fa; }

  /* Plotly: la grafen blende inn i kortet */
  .js-plotly-plot .modebar { background: transparent !important; }

  /* Badge */
  .card-content .badge-warning {
    background: rgba(251, 191, 36, 0.18);
    color: #fcd34d;
    border: 1px solid rgba(251, 191, 36, 0.35);
  }

  /* Smaa hjelpetekster */
  .card-content .text-success { color: #4ade80 !important; }
  .card-content .text-danger  { color: #f87171 !important; }
  .card-content .text-warning { color: #fbbf24 !important; }
  .card-content .text-info    { color: #60a5fa !important; }

  /* Container - litt mer luft */
  .pa-container {
    padding: 28px 24px 40px;
  }
</style>
