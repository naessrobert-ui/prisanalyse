<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <title>Væranalyse – Snømengde i Norge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #111827;
      }
      .page {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 16px 40px;
      }
      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 20px 24px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        margin-bottom: 20px;
      }
      .card h1 {
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      .card h2 {
        font-size: 1.2rem;
        margin: 0 0 6px;
      }
      .card p {
        margin: 0 0 12px;
        color: #4b5563;
      }
      .date-form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .date-form label {
        font-size: 0.95rem;
        color: #374151;
      }
      .date-form input[type="date"] {
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 0.95rem;
      }
      .date-form button {
        padding: 7px 16px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: white;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .date-form button:hover {
        background: #1d4ed8;
      }
      .helper-text {
        font-size: 0.8rem;
        color: #6b7280;
      }
      #map-frame {
        width: 100%;
        height: 80vh;
        border: none;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Væranalyse</h1>
        <p>Her bygger vi opp flere væremoduler. Snømengde-kartet viser målt snødybde i Norge fra Frost-data.</p>
      </div>

      <div class="card">
        <h2>Snømengde i Norge</h2>
        <p>
          Kartet viser snødybde for valgt dato. Standard er siste tilgjengelige dato
          (i dag med fallback ±2 dager).
        </p>

        <form id="date-form" class="date-form">
          <label for="date-input">Velg dato:</label>
          <input
            type="date"
            id="date-input"
            name="date"
            value="{{ default_date }}"
            max="{{ default_date }}"
          />
          <button type="submit">Vis kart</button>
          <span class="helper-text">
            Tom dato = siste tilgjengelige målinger.
          </span>
        </form>
      </div>

      <iframe
        id="map-frame"
        src="{{ url_for('ver.snomengde_kart') }}"
        loading="lazy"
      ></iframe>
    </div>

    <script>
      const form = document.getElementById('date-form');
      const input = document.getElementById('date-input');
      const frame = document.getElementById('map-frame');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const d = input.value;
        const baseUrl = "{{ url_for('ver.snomengde_kart') }}";
        frame.src = d ? `${baseUrl}?date=${encodeURIComponent(d)}` : baseUrl;
      });
    </script>
  </body>
</html>
