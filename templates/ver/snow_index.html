<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <title>Snømengde i Norge – Væranalyse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
      }

      .page {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 16px 32px;
      }

      .card {
        background: white;
        border-radius: 16px;
        padding: 18px 22px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        margin-bottom: 16px;
      }

      .card h1 {
        margin: 0 0 8px;
      }

      .date-form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        align-items: center;
      }

      .date-form input {
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
      }

      .date-form button {
        padding: 7px 14px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      #map-frame {
        width: 100%;
        height: 80vh;
        border: none;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
        background: #e5e7eb;
      }
    </style>
  </head>

  <body>
    <div class="page">

      <div class="card">
        <h1>Snømengde i Norge</h1>
        <p>
          Kartet viser snødybde fra Frost-data. Standard er siste tilgjengelige dato
          (med fallback ±2 dager for stasjoner uten data).
        </p>

        <form id="date-form" class="date-form">
          <label for="date-input">Velg dato:</label>

          <input
            type="date"
            id="date-input"
            name="date"
            value="{{ default_date }}"
            max="{{ default_date }}"
          />

          <button type="submit">Vis</button>
        </form>
      </div>

      <iframe
        id="map-frame"
        src="{{ url_for('ver.snomengde_kart') }}"
        loading="lazy"
      ></iframe>

    </div>

    <script>
      const form = document.getElementById("date-form");
      const input = document.getElementById("date-input");
      const frame = document.getElementById("map-frame");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const d = input.value;
        const baseUrl = "{{ url_for('ver.snomengde_kart') }}";
        frame.src = d ? `${baseUrl}?date=${encodeURIComponent(d)}` : baseUrl;
      });
    </script>
  </body>
</html>
